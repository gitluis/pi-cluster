<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-label="Two editions of Raspbian (Raspberry Pi OS): Desktop, a full graphical desktop that needs a monitor, keyboard and mouse; and Lite, command line only, best for cluster nodes managed over SSH.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/><stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="880" height="400" rx="24" fill="url(#bg)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="54" fill="#F8FAFC" font-size="22" font-weight="700">Raspbian (now Raspberry Pi OS) comes in two editions</text>

    <!-- Desktop monitor -->
    <rect x="60" y="86" width="340" height="200" rx="12" fill="#0B1220" stroke="#475569" stroke-width="2"/>
    <rect x="72" y="98" width="316" height="176" rx="4" fill="url(#wall)"/>
    <rect x="72" y="98" width="316" height="18" rx="4" fill="#0F172A" fill-opacity=".85"/>
    <circle cx="84" cy="107" r="4" fill="#38BDF8"/>
    <rect x="96" y="104" width="34" height="6" rx="3" fill="#475569"/>
    <rect x="138" y="104" width="34" height="6" rx="3" fill="#475569"/>
    <rect x="340" y="104" width="38" height="6" rx="3" fill="#475569"/>
    <!-- windows -->
    <rect x="96" y="132" width="160" height="104" rx="6" fill="#F8FAFC"/>
    <rect x="96" y="132" width="160" height="16" rx="6" fill="#CBD5E1"/>
    <rect x="108" y="160" width="100" height="6" rx="3" fill="#94A3B8"/>
    <rect x="108" y="174" width="130" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="108" y="188" width="116" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="108" y="202" width="80" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="236" y="160" width="132" height="94" rx="6" fill="#0B1220"/>
    <rect x="236" y="160" width="132" height="14" rx="6" fill="#334155"/>
    <path d="M248 188l6 4-6 4M260 198h30" stroke="#4ADE80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="248" y="208" width="84" height="5" rx="2.5" fill="#475569"/>
    <rect x="248" y="220" width="64" height="5" rx="2.5" fill="#475569"/>
    <path d="M206 286v24M174 312h64" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

    <!-- Lite: terminal -->
    <rect x="480" y="86" width="340" height="200" rx="12" fill="#0B1220" stroke="#475569" stroke-width="2"/>
    <rect x="492" y="98" width="316" height="176" rx="4" fill="#020617"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5">
      <text x="506" y="126" fill="#94A3B8">master login: <tspan fill="#F8FAFC">pi</tspan></text>
      <text x="506" y="150" fill="#94A3B8">Password:</text>
      <text x="506" y="182" fill="#4ADE80">pi@master<tspan fill="#94A3B8">:</tspan><tspan fill="#60A5FA">~ $</tspan> <tspan fill="#F8FAFC">sudo apt update</tspan></text>
      <text x="506" y="206" fill="#64748B">Reading package lists... Done</text>
      <text x="506" y="238" fill="#4ADE80">pi@master<tspan fill="#94A3B8">:</tspan><tspan fill="#60A5FA">~ $</tspan></text>
    </g>
    <rect x="623" y="226" width="9" height="16" fill="#F8FAFC"/>
    <path d="M650 286v24M618 312h64" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

    <!-- captions -->
    <text x="230" y="348" fill="#F8FAFC" font-size="17" font-weight="700" text-anchor="middle">Desktop</text>
    <text x="230" y="372" fill="#94A3B8" font-size="14" text-anchor="middle">graphical desktop · needs monitor, keyboard, mouse</text>
    <text x="650" y="348" fill="#F8FAFC" font-size="17" font-weight="700" text-anchor="middle">Lite</text>
    <text x="650" y="372" fill="#94A3B8" font-size="14" text-anchor="middle">command line only · best for cluster nodes over SSH</text>
  </g>
</svg>
