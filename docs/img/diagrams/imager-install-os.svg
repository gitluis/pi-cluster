<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" role="img" aria-label="Install Raspbian (Raspberry Pi OS) with Raspberry Pi Imager: Open Imager (Raspberry Pi Imager), then Choose OS (Raspbian / Lite / Full), then Choose storage (your microSD card), then Write (image is written), then Verify (card is checked)">
